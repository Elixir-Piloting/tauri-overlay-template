[package]
name = "tauri-overlay-template"
version = "0.1.0"
description = "Always-on-top, click-through-capable desktop overlay template (Tauri v2 + Next.js)"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
hit_regions = { package = "hit-regions-rs", git = "https://github.com/Elixir-Piloting/hit-regions-rs", tag = "v1.0.0" }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
